<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top channels — Watchtime</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="gate" class="gate hidden">
    <div class="card">
      <h2>Watchtime</h2>
      <p style="color:var(--muted); margin-top:8px; font-size:13px;">
        Paste your API key to unlock the dashboard.
      </p>
      <input id="gate-input" type="password" placeholder="API key" autocomplete="off">
      <button id="gate-submit">Unlock</button>
      <div id="gate-err" class="err"></div>
    </div>
  </div>

  <div id="app" class="page hidden">
    <div class="topbar">
      <h1 id="page-title">Top channels</h1>
      <nav class="topnav">
        <a href="/">Merged</a>
        <a href="/twitch">Twitch</a>
        <a href="/youtube">YouTube</a>
        <a href="/x">X</a>
        <a href="/facebook">Facebook</a>
        <a href="/instagram">Instagram</a>
        <a href="/plex">Plex</a>
        <a href="/settings">Settings</a>
      </nav>
      <select id="account-picker" class="account-picker"></select>
    </div>

    <div class="pills">
      <button class="pill" data-window="today">Today</button>
      <button class="pill" data-window="week">Last 7 days</button>
      <button class="pill" data-window="month">Last 30 days</button>
      <button class="pill" data-window="all">All-time</button>
      <span class="length-sep"></span>
      <button class="pill length" data-limit="50">50</button>
      <button class="pill length" data-limit="100">100</button>
      <button class="pill length" data-limit="200">200</button>
      <button class="pill length" data-limit="250">250</button>
      <button class="pill length" data-limit="all">All</button>
    </div>

    <div class="card">
      <h2 id="list-label">Top channels — Today</h2>
      <div id="channels" class="ranked"></div>
    </div>
  </div>

  <script src="/static/channels.js"></script>
</body>
</html>
